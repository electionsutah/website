<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
#marker-comparison{font-family:'Noto Sans',sans-serif;color:#343430;--color-blue:#006eb7;--color-blue-tint:#e5f2f9;--color-success:#2f7a45;--color-red:#d42f20}
#marker-comparison *{box-sizing:border-box}
#marker-comparison .variants{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#marker-comparison h2{font:600 14px 'Noto Sans',sans-serif;margin:0 0 14px;color:var(--foreground)}
#marker-comparison .results{background:#fff;border:1px solid #cbc9c3;padding:18px 12px}
#marker-comparison .stage+.stage{border-top:1px solid #deddd8;margin-top:22px;padding-top:22px}
#marker-comparison header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#marker-comparison .date{width:43px;flex:none;border:1px solid #cbc9c3;background:#f8f7f4;text-align:center;padding:4px;font-size:10px;font-weight:700}
#marker-comparison .date b{display:block;font-size:21px;line-height:1.15}
#marker-comparison h3{font-size:11px;letter-spacing:.06em;line-height:1.5;margin:0}
#marker-comparison .source{display:block;color:var(--color-blue);font-size:11px;text-decoration:underline;font-weight:400;letter-spacing:0}
#marker-comparison .row{padding:8px 0;font-size:12px}
#marker-comparison .selected{background:var(--color-blue-tint);padding:12px 8px;margin:0 -4px 4px;display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:10px}
#marker-comparison .with-marker{display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:10px;padding-inline:4px}
#marker-comparison .marker{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;color:var(--color-blue);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
#marker-comparison .selected .marker{color:var(--color-success)}
#marker-comparison .selected .marker,#marker-comparison .with-marker .marker{align-self:end;transform:translateY(7px)}
#marker-comparison .with-marker .marker{color:var(--color-red)}
#marker-comparison .candidate{color:var(--color-blue);text-decoration:underline;font-weight:600}
#marker-comparison .party{color:#60605a;text-decoration:underline}
#marker-comparison .totals{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0;color:#60605a;font-size:11px}
#marker-comparison .totals strong{font-size:16px;color:#343430}
#marker-comparison .track{height:10px;background:#e3e2dd}
#marker-comparison .bar{height:100%;background:#2675aa}
#marker-comparison footer{font-size:10px;color:#60605a;margin-top:14px}
@media(max-width:560px){#marker-comparison .variants{grid-template-columns:1fr}}
</style>
<div id="marker-comparison"><div class="variants"></div></div>
<script>
(()=>{
const root=document.getElementById('marker-comparison');
const stages=[{title:'Primary election results',month:'JUN',day:23,updated:'Oct 30, 10:10 AM MDT',rows:[['Ben McAdams','Democratic','29,737','51.90',true],['Nate Blouin','Democratic','15,771','27.53'],['Liban Mohamed','Democratic','9,542','16.65'],['Michael Farrell','Democratic','2,245','3.92']]},{title:'General election results',month:'NOV',day:3,updated:'Nov 10, 12:24 PM MST',rows:[['Ben McAdams','Democratic','174,492','70.06',true],['Riley Owen','Republican','65,190','26.17'],['Jesse West','Libertarian','5,707','2.29'],['Elias Henry Montgomery','Unaffiliated','3,593','1.44'],['Babak "bobby" Darvish','Unaffiliated','76','0.03']]}];
root.querySelector('.variants').innerHTML=[['Icons aligned with color bars','with_cancel']].map(([label,icon])=>`<section><h2>${label}</h2><div class="results">${stages.map(s=>`<section class="stage"><header><div class="date">${s.month}<b>${s.day}</b>2026</div><h3>${s.title.toUpperCase()}<span class="source">Unofficial</span></h3></header>${s.rows.map(([name,party,votes,share,selected])=>`<div class="row ${selected?'selected':icon==='with_cancel'?'with-marker':''}">${selected || icon==='with_cancel'?`<span class="marker" aria-label="${selected?'Leading':'Trailing'}">${selected?(icon==='with_cancel'?'check_circle':icon):'cancel'}</span>`:''}<div><div><span class="candidate">${name}</span> <span class="party">- ${party}</span></div><div class="totals"><span>${votes} votes</span><strong>${share}%</strong></div><div class="track"><div class="bar" style="width:${share}%;background:${party==='Republican'?'#bc443d':party==='Libertarian'?'#886e13':party==='Unaffiliated'?'#5f5e59':'#2675aa'}"></div></div></div></div>`).join('')}<footer>Updated ${s.updated}</footer></section>`).join('')}</div></section>`).join('');
})();
</script>
